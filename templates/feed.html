<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Food Feed - Food Wise</title>
    <style>
        body {
            background-color: #f4f7f6;
            font-family: Arial, Helvetica, sans-serif;
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        .header {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 20px;
        }
        .map-container {
            background-color: #ffffff; padding: 20px; border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1); width: 80%;
            max-width: 1000px;
        }
        #search-input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box; 
        }
        #search-input:focus {
            outline: none;
            border-color: #2ecc71;
            box-shadow: 0 0 5px rgba(46, 204, 113, 0.3);
        }
        /* ---------------------------------- */

        #map { height: 500px; width: 100%; border-radius: 6px; border: 1px solid #dcdde1; }
        .info-window { font-family: Arial, sans-serif; color: #2c3e50; }
        .info-window h3 { margin: 0 0 5px 0; color: #2ecc71; }
        .info-window p { margin: 5px 0; font-size: 14px; }
    </style>
</head>
<body>

    <div class="header">
        <h2>Available Surplus Food</h2>
        <p>Click on a pin to view food details or search for your city below.</p>
    </div>

    <div class="map-container">
        <input id="search-input" type="text" placeholder="Search for a city, postcode, or address...">
        
        <div id="map"></div>
    </div>

    <script>
        const foodListings = {{ listings | tojson | safe }};

        function initMap() {
            const map = new google.maps.Map(document.getElementById("map"), {
                zoom: 6, // Zoomed out to see the whole UK/Ireland
                center: { lat: 53.4830, lng: -2.2355 }, // Centered near Manchester
            });

            // 1. Loop through the database items to create pins
            foodListings.forEach(item => {
                const marker = new google.maps.Marker({
                    position: { lat: parseFloat(item.latitude), lng: parseFloat(item.longitude) },
                    map: map,
                    title: item.food_name
                });

                const contentString = `
                    <div class="info-window">
                        <h3>${item.food_name}</h3>
                        <p><b>Price:</b> £${item.price}</p>
                        <p><b>Pickup:</b> ${item.pickup_address}</p>
                    </div>
                `;

                const infoWindow = new google.maps.InfoWindow({
                    content: contentString
                });

                marker.addListener("click", () => {
                    infoWindow.open({ anchor: marker, map });
                });
            });

            // 2. Grab the search box and attach Google Places to it
            const input = document.getElementById("search-input");
            const autocomplete = new google.maps.places.Autocomplete(input);
            
            // Bias the search results to the map's current view
            autocomplete.bindTo("bounds", map);

            // 3. Listen for when the user clicks a dropdown suggestion
            autocomplete.addListener("place_changed", () => {
                const place = autocomplete.getPlace();

                // If they hit enter without clicking a suggestion, do nothing
                if (!place.geometry || !place.geometry.location) {
                    return; 
                }

                // If Google has the shape of the city/place, fit it to the screen
                if (place.geometry.viewport) {
                    map.fitBounds(place.geometry.viewport);
                } else {
                    // Otherwise, just centre on the exact dot and zoom in
                    map.setCenter(place.geometry.location);
                    map.setZoom(14); 
                }
            });
        }
    </script>

    <script async defer
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyCnpffqbRwIifOqXkCE_Wl2Q2wKgeIWbeM&libraries=places&callback=initMap">
    </script>

</body>
</html>
